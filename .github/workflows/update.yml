name: Check upstream and update PKGBUILD

on:
  schedule:
    # 每天检查一次新版本
    - cron: '0 8 * * *'
  workflow_dispatch:  # 支持手动触发
  push:
    branches: [master, main]

permissions:
  contents: write
  actions: write

jobs:
  check-update:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: System dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git go namcap
          # xcaddy is in AUR, not official repos; install via go install to /usr/local/bin
          GO111MODULE=on GOBIN=/usr/local/bin go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest
          which xcaddy

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          path: aur-repo

      - name: Check latest Caddy version
        id: caddy-version
        run: |
          cd aur-repo
          current=$(grep -oP '^pkgver=\K.*' PKGBUILD)
          echo "current=$current" >> $GITHUB_OUTPUT
          
          latest=$(curl -sL https://api.github.com/repos/caddyserver/caddy/releases/latest | grep -oP '"tag_name": "v\K[^"]+')
          echo "latest=$latest" >> $GITHUB_OUTPUT
          echo "Current: $current, Latest: $latest"

      - name: Update PKGBUILD if needed
        id: update
        if: ${{ steps.caddy-version.outputs.latest != '' && steps.caddy-version.outputs.latest != steps.caddy-version.outputs.current }}
        run: |
          cd aur-repo
          old=${{ steps.caddy-version.outputs.current }}
          new=${{ steps.caddy-version.outputs.latest }}
          echo "Updating PKGBUILD: $old -> $new"
          
          sed -i "s/^pkgver=$old$/pkgver=$new/" PKGBUILD
          sed -i "s/^pkgrel=.*$/pkgrel=1/" PKGBUILD
          
          # Update version in .SRCINFO
          sed -i "s/^\\tpkgver = $old$/\\tpkgver = $new/" .SRCINFO
          
          echo "updated=true" >> $GITHUB_OUTPUT

      - name: Build and test package
        if: steps.update.outputs.updated == 'true'
        run: |
          cd aur-repo
          # Create non-root user for makepkg
          useradd -m builder
          chown -R builder:builder .
          su builder -c "makepkg -f --noconfirm" 2>&1 || true
          namcap PKGBUILD || true

      - name: Commit and push to GitHub
        if: steps.update.outputs.updated == 'true'
        run: |
          cd aur-repo
          git config user.name "tsaitang404"
          git config user.email "tsaitang404@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git commit -m "chore: bump to v${{ steps.caddy-version.outputs.latest }}"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:master

      - name: Push to AUR
        if: steps.update.outputs.updated == 'true'
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_KEY" ]; then
            echo "AUR_SSH_PRIVATE_KEY not set, skipping AUR push"
            exit 0
          fi
          cd aur-repo
          mkdir -p ~/.ssh
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          echo "$AUR_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          git remote add aur ssh://aur@aur.archlinux.org/caddy-trojan.git
          GIT_SSH_COMMAND="ssh -i ~/.ssh/aur" git push aur master

      - name: Create release
        if: steps.update.outputs.updated == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.caddy-version.outputs.latest }}
          name: "caddy-trojan v${{ steps.caddy-version.outputs.latest }}"
          generate_release_notes: true
